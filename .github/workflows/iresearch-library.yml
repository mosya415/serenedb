name: IResearch library

on:
  workflow_dispatch:
  pull_request:
    paths:
      - CMakeLists.txt
      - cmake/**
      - iresearch/**
      - third_party/**
      - examples/iresearch-ffi/**
      - scripts/ci/check_ffi_consumer.sh
      - scripts/ci/check_ffi_install.sh
      - .github/workflows/iresearch-library.yml
  push:
    paths:
      - CMakeLists.txt
      - cmake/**
      - iresearch/**
      - third_party/**
      - examples/iresearch-ffi/**
      - scripts/ci/check_ffi_consumer.sh
      - scripts/ci/check_ffi_install.sh
      - .github/workflows/iresearch-library.yml

permissions:
  contents: read

concurrency:
  group: iresearch-library-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: gcc
      CXX: clang++-21
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: true
      - name: Install supported toolchain
        run: |
          set -euo pipefail
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/llvm.asc > /dev/null
          echo 'deb https://apt.llvm.org/noble/ llvm-toolchain-noble-21 main' | sudo tee /etc/apt/sources.list.d/llvm-21.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-21 llvm-21 lld-21 libclang-rt-21-dev ninja-build cmake ccache make python3 perl gcc binutils
      - name: Configure library only
        run: |
          set -euo pipefail
          cmake -S . -B build_ffi -G Ninja \
            -DSDB_BUILD_IRESEARCH_ONLY=ON -DAUTO_UPDATE_MODULES=OFF \
            -DCMAKE_BUILD_TYPE=Release -DUSE_IPO=OFF -DUSE_DEBUG_INFO=NONE \
            -DSTATIC_EXECUTABLES=OFF -DSDB_ALLOC= \
            -DCMAKE_C_COMPILER=clang-21 -DCMAKE_CXX_COMPILER=clang++-21 \
            -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld \
            -DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld 2>&1 | tee ffi-configure.log
      - name: Verify empty extension registry
        run: |
          set -euo pipefail
          cmake --build build_ffi --target help > targets.txt
          python3 - <<'PY'
          import pathlib
          import re
          log = pathlib.Path("ffi-configure.log").read_text()
          linked = re.findall(r"Linked into DuckDB: extensions \[([^\]]*)\]", log)
          if not linked or any(names.strip() for names in linked):
              raise SystemExit("Configure output does not prove zero linked DuckDB extensions")
          targets = {line.partition(":")[0] for line in pathlib.Path("targets.txt").read_text().splitlines()}
          forbidden = {name for name in targets if name.endswith("_extension") and name != "duckdb_main_extension"}
          forbidden.update(targets.intersection({"serened", "serenedb"}))
          if forbidden:
              raise SystemExit(f"Unexpected server or DuckDB extension targets: {sorted(forbidden)}")
          print("Configure reports zero linked DuckDB extensions; no extension or server targets exist")
          PY
      - name: Build library
        run: cmake --build build_ffi --target iresearch-ffi -j 4
      - name: Verify all external consumers
        run: |
          set -euo pipefail
          ./scripts/ci/check_ffi_consumer.sh --skip-build build_ffi | tee ffi-consumers.log
      - name: Verify relocated installed package
        run: |
          set -euo pipefail
          ./scripts/ci/check_ffi_install.sh build_ffi | tee ffi-install.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: iresearch-library-linux-logs
          path: |
            ffi-consumers.log
            ffi-install.log
            ffi-configure.log
            targets.txt
          if-no-files-found: ignore
